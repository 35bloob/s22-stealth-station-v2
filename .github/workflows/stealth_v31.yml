name: Autonomous S22 Solver V25
on:
  workflow_dispatch:
jobs:
  agent_build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc flex bison libssl-dev libelf-dev git curl wget zip unzip python3 \
          device-tree-compiler jq rsync llvm lld clang gcc-aarch64-linux-gnu
      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth 1 https://github.com/yoro1836/zero_kernel.git src
          cd src
          
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          find . -type f -name "*defconfig" -exec sed -i 's/CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_NONE=y/g' {} +
          find . -type f -name "*defconfig" -exec sed -i 's/CONFIG_LTO_CLANG_THIN=y/CONFIG_LTO_CLANG_NONE=y/g' {} +
          
          export ARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make gki_defconfig
          
          chmod +x scripts/config
          ./scripts/config --enable CONFIG_USB_F_HID
          ./scripts/config --enable CONFIG_USB_CONFIGFS_F_HID
          ./scripts/config --enable CONFIG_QCACLD_WLAN_MONITOR
          ./scripts/config --disable CONFIG_MODULE_SIG
          
          make olddefconfig
          make -j$(nproc) LLVM=1 KCFLAGS="-w" Image
          
          cp arch/arm64/boot/Image $GITHUB_WORKSPACE/Image
      - name: Package
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          cp Image AK3/Image
          
          # Patch anykernel.sh for S22 r0q
          cd AK3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's/device.name1=/device.name1=r0q/' anykernel.sh
          sed -i 's/device.name2=/device.name2=r0qxxx/' anykernel.sh
          
          zip -r9 ../StealthStation-V25.zip .
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: StealthStation-Final
          path: StealthStation-V25.zip
