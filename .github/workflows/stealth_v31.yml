- name: Package
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          cp Image AK3/Image
          
          # Patch anykernel.sh for S22 r0q
          cd AK3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          # Also set device name in case check stays enabled
          sed -i 's/device.name1=/device.name1=r0q/' anykernel.sh
          sed -i 's/device.name2=/device.name2=r0qxxx/' anykernel.sh
          
          zip -r9 ../StealthStation-V25.zip .
