name: S22 Stealth V8.0
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swap Memory & Tools
        run: |
          set -e
          echo "Adding 10GB Swap Memory to prevent crashes..."
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          sudo apt-get update
          sudo apt-get install -y bc flex bison libssl-dev libelf-dev git curl wget zip unzip python3 device-tree-compiler jq rsync llvm lld clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          
          mkdir -p $GITHUB_WORKSPACE/clang
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.0/clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          tar -xJf clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz -C $GITHUB_WORKSPACE/clang --strip-components=1
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          
      - name: Source & Core Kernel Build
        run: |
          git clone --depth 1 https://github.com/Vikinsson207/android_kernel_samsung_sm8450.git src
          cd src/kernel_platform/msm-kernel || cd src
          
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          sed -i 's/in_group_p(F2FS_OPTION(sbi).flush_group)/1/g' fs/f2fs/data.c || true
          find . -name "Makefile" -exec sed -i 's/-Werror//g' {} + || true
          
          export ARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          
          echo "=== LOADING CONFIGURATION ==="
          # Hardcoded Config Logic (No more guessing)
          if [ -f arch/arm64/configs/vendor/waipio_defconfig ]; then
            make vendor/waipio_defconfig
          elif [ -f arch/arm64/configs/vendor/taro_defconfig ]; then
            make vendor/taro_defconfig
          else
            make gki_defconfig
          fi
          
          cat ${{ github.workspace }}/configs/nethunter.config >> .config
          cat ${{ github.workspace }}/configs/stealth.config >> .config
          
          scripts/config --disable WERROR
          scripts/config --disable LTO_CLANG_FULL
          scripts/config --disable LTO_CLANG_THIN
          scripts/config --enable LTO_NONE
          
          make olddefconfig
          
          echo "=== COMPILING KERNEL ==="
          # Throttled to -j4 to prevent memory overload on GitHub servers
          make -j4 LLVM=1 KCFLAGS="-w -Wno-error" Image
          
      - name: Build WiFi Module
        run: |
          cd ${{ github.workspace }}
          git clone --depth=1 https://github.com/kelebek333/rtl8188fu
          cd rtl8188fu
          make -j4 ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- KSRC=${{ github.workspace }}/src/kernel_platform/msm-kernel modules || echo "Module compilation failed, proceeding to package kernel."
          
      - name: Package
        run: |
          cd ${{ github.workspace }}
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          IMG=$(find src -name "Image" -type f | head -1)
          cp "$IMG" AK3/Image
          cp anykernel/anykernel.sh AK3/anykernel.sh
          find rtl8188fu -name "*.ko" -exec cp {} AK3/ \; || true
          cd AK3 && zip -r9 ../StealthStation-V8.zip .
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: StealthStation-Final
          path: StealthStation-V8.zip
