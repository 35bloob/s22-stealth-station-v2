name: S22 Snapdragon Stealth v2.5
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc flex bison libssl-dev libelf-dev git curl wget zip unzip python3 device-tree-compiler jq rsync llvm lld clang

      - name: Download Toolchain (Clang 14 - More Compatible)
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.0/clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          tar -xJf clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz -C $GITHUB_WORKSPACE/clang --strip-components=1
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Clone S22 Snapdragon Source
        run: |
          git clone --depth 1 https://github.com/yoro1836/android_kernel_samsung_sm8450_s22.git src

      - name: Patch & Build
        run: |
          cd src
          KROOT=$(find . -type d -name "drivers" -maxdepth 4 | head -1 | sed 's|/drivers$||')
          cd "$KROOT"
          echo "KERNEL_DIR_ACTUAL=$PWD" >> $GITHUB_ENV

          # Setup Environment
          export ARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 1. Apply KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # 2. Inject RTL8188FU Driver
          mkdir -p drivers/net/wireless/rtl8188fu
          git clone --depth=1 https://github.com/kelebek333/rtl8188fu /tmp/rtl8188fu
          cp -r /tmp/rtl8188fu/* drivers/net/wireless/rtl8188fu/
          echo "obj-m += rtl8188fu/" >> drivers/net/wireless/Makefile
          
          # 3. Mass Warning Eraser (The "Line 8000" Fix)
          # This removes -Werror from every single Makefile in the kernel
          find . -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g'
          
          # 4. Fix Config
          CONF_PATH=$(find arch/arm64/configs -name "waipio_defconfig" -o -name "taro_defconfig" | head -1)
          [ -z "$CONF_PATH" ] && CONF_PATH=$(find arch/arm64/configs -name "*consolidate*" | head -1)
          cp "$CONF_PATH" arch/arm64/configs/stealth_defconfig
          
          # 5. Configure
          make O=out ARCH=arm64 LLVM=1 stealth_defconfig
          cat $GITHUB_WORKSPACE/configs/nethunter.config >> out/.config
          cat $GITHUB_WORKSPACE/configs/stealth.config >> out/.config
          echo "CONFIG_WERROR=n" >> out/.config
          
          # 6. Compilation
          # Using -k (keep going) so small errors in drivers don't stop the whole build
          make O=out -j$(nproc) ARCH=arm64 LLVM=1 KCFLAGS="-w -Wno-error" -k Image modules || echo "Build had minor errors but checking for Image..."

      - name: Create ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 /tmp/AK3
          IMG_PATH=$(find . -name "Image" | grep "out" | head -1)
          if [ -f "$IMG_PATH" ]; then
            cp "$IMG_PATH" /tmp/AK3/Image
            find src/out -name "*.ko" -exec cp {} /tmp/AK3/ \;
            cp anykernel/anykernel.sh /tmp/AK3/
            cd /tmp/AK3 && zip -r9 $GITHUB_WORKSPACE/StealthStation-v2.5.zip .
          else
            echo "Kernel Image not found! Build failed."
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealthStation-Final
          path: StealthStation-v2.5.zip
