name: S22 Stealth V7.0
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute Build
        run: |
          set -e
          
          echo "=== 1. TOOLS & TOOLCHAIN ==="
          sudo apt-get update
          sudo apt-get install -y bc flex bison libssl-dev libelf-dev git curl wget zip unzip python3 device-tree-compiler jq rsync llvm lld clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          mkdir -p clang
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.0/clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          tar -xJf clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz -C clang --strip-components=1
          export PATH=$PWD/clang/bin:$PATH
          
          echo "=== 2. KERNEL SOURCE ==="
          git clone --depth 1 https://github.com/Vikinsson207/android_kernel_samsung_sm8450.git src
          cd src/kernel_platform/msm-kernel || cd src
          
          echo "=== 3. DEEP CLEANING SAMSUNG HARDWARE DRIVERS ==="
          # This obliterates the hardcoded kill-switches in Samsung's techpack folders
          find . -type f \( -name "Makefile" -o -name "Kbuild" -o -name "*.mk" \) -exec sed -i 's/-Werror//g' {} + || true
          find . -type f \( -name "Makefile" -o -name "Kbuild" -o -name "*.mk" \) -exec sed -i 's/-Wfatal-errors//g' {} + || true
          
          echo "=== 4. INTEGRATING KERNELSU ==="
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          echo "=== 5. CONFIGURING CUSTOM FEATURES ==="
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          
          DEFCONFIG=$(find arch/arm64/configs -name "*waipio*" -o -name "*taro*" | head -1 | sed 's|arch/arm64/configs/||')
          make $DEFCONFIG
          
          cat ${{ github.workspace }}/configs/nethunter.config >> .config
          cat ${{ github.workspace }}/configs/stealth.config >> .config
          
          # Force the compiler to accept our changes
          scripts/config --disable WERROR
          scripts/config --disable LTO_CLANG_FULL
          scripts/config --disable LTO_CLANG_THIN
          scripts/config --enable LTO_NONE
          
          make olddefconfig
          
          echo "=== 6. COMPILING CORE KERNEL ==="
          # The -w flag turns off ALL warnings, ignoring Samsung's messy code
          make -j$(nproc) LLVM=1 KCFLAGS="-w -Wno-error" Image
          
          echo "=== 7. COMPILING WIFI MODULE ==="
          cd ${{ github.workspace }}
          git clone --depth=1 https://github.com/kelebek333/rtl8188fu
          cd rtl8188fu
          make -j$(nproc) ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- KSRC=${{ github.workspace }}/src/kernel_platform/msm-kernel modules || echo "Module warning: Proceeding to package..."
          
          echo "=== 8. PACKAGING ==="
          cd ${{ github.workspace }}
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          IMG=$(find src -name "Image" -type f | head -1)
          cp "$IMG" AK3/Image
          cp anykernel/anykernel.sh AK3/anykernel.sh
          find rtl8188fu -name "*.ko" -exec cp {} AK3/ \; || true
          cd AK3 && zip -r9 ../StealthStation-V7.zip .
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: StealthStation-Final
          path: StealthStation-V7.zip
