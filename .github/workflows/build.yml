name: S22 Stealth V5.0
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute Build
        run: |
          set -e
          
          echo "=== 1. TOOLS & TOOLCHAIN ==="
          sudo apt-get update
          sudo apt-get install -y bc flex bison libssl-dev libelf-dev git curl wget zip unzip python3 device-tree-compiler jq rsync llvm lld clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          mkdir -p clang
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.0/clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          tar -xJf clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz -C clang --strip-components=1
          export PATH=$PWD/clang/bin:$PATH
          
          echo "=== 2. SOURCE & INTEGRATIONS ==="
          git clone --depth 1 https://github.com/Vikinsson207/android_kernel_samsung_sm8450.git src
          cd src/kernel_platform/msm-kernel || cd src
          
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          mkdir -p drivers/net/wireless/rtl8188fu
          git clone --depth=1 https://github.com/kelebek333/rtl8188fu drivers/net/wireless/rtl8188fu
          echo "obj-y += rtl8188fu/" >> drivers/net/wireless/Makefile
          
          echo "=== 3. FIXING ERRORS (CRITICAL) ==="
          sed -i 's/in_group_p(F2FS_OPTION(sbi).flush_group)/1/g' fs/f2fs/data.c || true
          # This must run AFTER cloning the Wi-Fi driver to strip its errors too
          find . -name "Makefile" -exec sed -i 's/-Werror//g' {} + || true
          
          echo "=== 4. CONFIGURATION ==="
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          
          DEFCONFIG=$(find arch/arm64/configs -name "waipio_defconfig" -o -name "taro_defconfig" | head -1 | sed 's|arch/arm64/configs/||')
          make $DEFCONFIG
          
          cat ${{ github.workspace }}/configs/nethunter.config >> .config
          cat ${{ github.workspace }}/configs/stealth.config >> .config
          
          # Use Linux kernel tools to safely disable crashing features
          scripts/config --disable LTO_CLANG_FULL || true
          scripts/config --disable LTO_CLANG_THIN || true
          scripts/config --enable LTO_NONE || true
          scripts/config --disable WERROR || true
          
          make olddefconfig
          
          echo "=== 5. COMPILING KERNEL ==="
          make -j$(nproc) LLVM=1 KCFLAGS="-w -Wno-error" Image
          
          echo "=== 6. PACKAGING ==="
          cd ${{ github.workspace }}
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          IMG=$(find src -name "Image" -type f | head -1)
          cp "$IMG" AK3/Image
          cp anykernel/anykernel.sh AK3/anykernel.sh
          cd AK3 && zip -r9 ../StealthStation-V5.zip .
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: StealthStation-Final
          path: StealthStation-V5.zip
