name: S22 Stealth v3.7
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y bc flex bison libssl-dev libelf-dev git curl wget zip unzip python3 device-tree-compiler jq rsync llvm lld clang gcc-aarch64-linux-gnu
      - name: Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xJf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz -C $GITHUB_WORKSPACE/clang --strip-components=1
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
      - name: Source
        run: git clone --depth 1 https://github.com/yoro1836/android_kernel_samsung_sm8450_s22.git src
      - name: Build
        run: |
          cd src/kernel_platform/msm-kernel
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          sed -i 's/dir-y += usr/dir-y += /g' Makefile || true
          sed -i 's/core-y += usr\//core-y += /g' Makefile || true
          sed -i 's/in_group_p(F2FS_OPTION(sbi).flush_group)/1/g' fs/f2fs/data.c || true
          find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-Werror//g' {} +
          echo "#!/bin/sh" > scripts/headers_install.sh
          echo "exit 0" >> scripts/headers_install.sh
          chmod +x scripts/headers_install.sh
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          git clone --depth=1 https://github.com/kelebek333/rtl8188fu drivers/net/wireless/rtl8188fu
          echo "obj-y += rtl8188fu/" >> drivers/net/wireless/Makefile
          make clean
          make gki_defconfig
          CONF=$(find arch/arm64/configs -name "*waipio*" -o -name "*taro*" | head -1)
          [ -n "$CONF" ] && cat "$CONF" >> .config
          cat $GITHUB_WORKSPACE/configs/nethunter.config >> .config
          cat $GITHUB_WORKSPACE/configs/stealth.config >> .config
          echo "CONFIG_WERROR=n" >> .config
          make olddefconfig
          make -j$(nproc) LLVM=1 LLVM_IAS=1 KCFLAGS="-w" arch/arm64/boot/Image
      - name: ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 /tmp/AK3
          IMG=$(find src -name "Image" -type f | head -1)
          cp "$IMG" /tmp/AK3/Image && cp anykernel/anykernel.sh /tmp/AK3/
          cd /tmp/AK3 && zip -r9 $GITHUB_WORKSPACE/StealthStation-v3.7.zip .
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: StealthStation-Final
          path: StealthStation-v3.7.zip
