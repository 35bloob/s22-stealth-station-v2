name: S22 Snapdragon Stealth v2.2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc flex bison libssl-dev libelf-dev git curl wget zip unzip python3 device-tree-compiler jq rsync llvm lld clang

      - name: Download Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xJf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz -C $GITHUB_WORKSPACE/clang --strip-components=1
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Clone S22 Snapdragon Source
        run: |
          git clone --depth 1 https://github.com/yoro1836/android_kernel_samsung_sm8450_s22.git src

      - name: Patch & Build
        run: |
          cd src
          # Find the actual kernel root
          KROOT=$(find . -type d -name "drivers" -maxdepth 4 | head -1 | sed 's|/drivers$||')
          cd "$KROOT"
          echo "KERNEL_DIR_ACTUAL=$PWD" >> $GITHUB_ENV

          # Setup Environment
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Apply KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # Inject RTL8188FU Driver
          mkdir -p drivers/net/wireless/rtl8188fu
          git clone --depth=1 https://github.com/kelebek333/rtl8188fu /tmp/rtl8188fu
          cp -r /tmp/rtl8188fu/* drivers/net/wireless/rtl8188fu/
          echo "obj-y += rtl8188fu/" >> drivers/net/wireless/Makefile
          
          # SMART CONFIG SEARCH
          # Look for taro, then sm8450, then waipio, then gki
          CONF=$(find arch/arm64/configs -name "*taro*" -o -name "*sm8450*" -o -name "*waipio*" | head -1)
          if [ -z "$CONF" ]; then
            CONF=$(find arch/arm64/configs -name "gki_defconfig" | head -1)
          fi
          
          DEFCONFIG=$(basename $CONF)
          echo "Using Config: $DEFCONFIG"
          
          make O=out ARCH=arm64 LLVM=1 $DEFCONFIG
          
          # Merge Stealth Fragments
          cat $GITHUB_WORKSPACE/configs/nethunter.config >> out/.config
          cat $GITHUB_WORKSPACE/configs/stealth.config >> out/.config
          
          # Compilation
          make O=out -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 Image

      - name: Create ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 /tmp/AK3
          # Find the built Image anywhere in the 'out' folder
          IMG_PATH=$(find . -name "Image" | grep "out" | head -1)
          cp "$IMG_PATH" /tmp/AK3/Image
          cp anykernel/anykernel.sh /tmp/AK3/
          cd /tmp/AK3 && zip -r9 $GITHUB_WORKSPACE/StealthStation-v2.2.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealthStation-Final
          path: StealthStation-v2.2.zip
