name: S22 Stealth v4.0-OMEGA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Global Execution
        run: |
          set -e
          echo "=== INSTALLING TOOLS ==="
          sudo apt-get update
          sudo apt-get install -y bc flex bison libssl-dev libelf-dev git curl wget zip unzip python3 device-tree-compiler jq rsync llvm lld clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          
          mkdir -p $GITHUB_WORKSPACE/clang
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.0/clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          tar -xJf clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz -C $GITHUB_WORKSPACE/clang --strip-components=1
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          echo "=== CLONING ==="
          git clone --depth 1 https://github.com/Vikinsson207/android_kernel_samsung_sm8450.git src
          
          # Foolproof folder detection
          if [ -d "src/kernel_platform/msm-kernel" ]; then
            cd src/kernel_platform/msm-kernel
          else
            cd src
          fi
          
          echo "=== PATCHING ==="
          sed -i 's/in_group_p(F2FS_OPTION(sbi).flush_group)/1/g' fs/f2fs/data.c || true
          find . -name "Makefile" -exec sed -i 's/-Werror//g' {} + || true
          
          echo "=== KERNELSU & WIFI ==="
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash - || true
          mkdir -p drivers/net/wireless/rtl8188fu
          git clone --depth=1 https://github.com/kelebek333/rtl8188fu /tmp/rtl8188fu
          cp -r /tmp/rtl8188fu/* drivers/net/wireless/rtl8188fu/
          echo "obj-y += rtl8188fu/" >> drivers/net/wireless/Makefile
          
          echo "=== CONFIGURING ==="
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          
          make gki_defconfig
          VCONF=$(find arch/arm64/configs -name "*waipio*" -o -name "*taro*" | head -1)
          [ -n "$VCONF" ] && cat "$VCONF" >> .config
          cat ${{ github.workspace }}/configs/nethunter.config >> .config
          cat ${{ github.workspace }}/configs/stealth.config >> .config
          echo "CONFIG_WERROR=n" >> .config
          echo "CONFIG_LTO_NONE=y" >> .config
          make olddefconfig
          
          echo "=== COMPILING (THE BYPASS) ==="
          make -j$(nproc) LLVM=1 KCFLAGS="-w -Wno-error" vmlinux
          llvm-objcopy -O binary vmlinux arch/arm64/boot/Image
          
          echo "=== PACKAGING ==="
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 /tmp/AK3
          cp arch/arm64/boot/Image /tmp/AK3/Image
          cp ${{ github.workspace }}/anykernel/anykernel.sh /tmp/AK3/anykernel.sh
          cd /tmp/AK3 && zip -r9 $GITHUB_WORKSPACE/StealthStation-Omega.zip .
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: StealthStation-Omega-Final
          path: StealthStation-Omega.zip
