name: S22 Stealth v2.11
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y bc flex bison libssl-dev libelf-dev git curl wget zip unzip python3 device-tree-compiler jq rsync llvm lld clang gcc-aarch64-linux-gnu
      - name: Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.0/clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          tar -xJf clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz -C $GITHUB_WORKSPACE/clang --strip-components=1
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
      - name: Source
        run: git clone --depth 1 https://github.com/yoro1836/android_kernel_samsung_sm8450_s22.git src
      - name: Build
        run: |
          cd src/kernel_platform/msm-kernel
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          mkdir -p drivers/net/wireless/rtl8188fu
          git clone --depth=1 https://github.com/kelebek333/rtl8188fu /tmp/rtl8188fu
          cp -r /tmp/rtl8188fu/* drivers/net/wireless/rtl8188fu/
          echo "obj-y += rtl8188fu/" >> drivers/net/wireless/Makefile
          make O=out ARCH=arm64 LLVM=1 gki_defconfig
          CONF=$(find arch/arm64/configs -name "waipio_defconfig" -o -name "taro_defconfig" | head -1)
          [ -n "$CONF" ] && cat "$CONF" >> out/.config
          [ -f $GITHUB_WORKSPACE/configs/nethunter.config ] && cat $GITHUB_WORKSPACE/configs/nethunter.config >> out/.config
          [ -f $GITHUB_WORKSPACE/configs/stealth.config ] && cat $GITHUB_WORKSPACE/configs/stealth.config >> out/.config
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          make O=out -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 KCFLAGS="-w" Image
      - name: ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 /tmp/AK3
          IMG=$(find src -name "Image" | grep "out" | head -1)
          [ -f "$IMG" ] && cp "$IMG" /tmp/AK3/Image && cp anykernel/anykernel.sh /tmp/AK3/
          cd /tmp/AK3 && zip -r9 $GITHUB_WORKSPACE/StealthStation-v2.11.zip .
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: StealthStation-Final
          path: StealthStation-v2.11.zip
