name: S22 Snapdragon Stealth v2.8
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc flex bison libssl-dev libelf-dev git curl wget zip unzip python3 device-tree-compiler jq rsync llvm lld clang

      - name: Download Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.0/clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          tar -xJf clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz -C $GITHUB_WORKSPACE/clang --strip-components=1
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Clone S22 Snapdragon Source
        run: |
          git clone --depth 1 https://github.com/yoro1836/android_kernel_samsung_sm8450_s22.git src

      - name: Patch & Build
        run: |
          # 1. GO DIRECTLY TO THE KNOWN KERNEL ROOT
          cd src/kernel_platform/msm-kernel
          echo "ACTUAL_KERNEL_DIR=$PWD" >> $GITHUB_ENV
          
          # 2. Setup Build Environment
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 3. Apply KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # 4. Inject RTL8188FU Driver
          mkdir -p drivers/net/wireless/rtl8188fu
          git clone --depth=1 https://github.com/kelebek333/rtl8188fu /tmp/rtl8188fu
          cp -r /tmp/rtl8188fu/* drivers/net/wireless/rtl8188fu/
          echo "obj-y += rtl8188fu/" >> drivers/net/wireless/Makefile
          
          # 5. Mass Warning Eraser (Bypass Werror)
          find . -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g' || true

          # 6. Build Config
          # Search for the best config in the vendor folder
          CONF_FILE=$(find arch/arm64/configs -name "*taro*" -o -name "*waipio*" -o -name "*sm8450*" | head -1)
          if [ -z "$CONF_FILE" ]; then
            CONF_FILE=$(find arch/arm64/configs -name "gki_defconfig" | head -1)
          fi
          echo "Using Config: $CONF_FILE"
          
          make O=out ARCH=arm64 LLVM=1 $(basename $CONF_FILE)
          
          # Merge Stealth Fragments
          [ -f $GITHUB_WORKSPACE/configs/nethunter.config ] && cat $GITHUB_WORKSPACE/configs/nethunter.config >> out/.config
          [ -f $GITHUB_WORKSPACE/configs/stealth.config ] && cat $GITHUB_WORKSPACE/configs/stealth.config >> out/.config
          echo "CONFIG_WERROR=n" >> out/.config
          
          # 7. Compilation
          make O=out -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 KCFLAGS="-w -Wno-error" Image

      - name: Create ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 /tmp/AK3
          IMG_PATH=$(find src/kernel_platform/msm-kernel/out -name "Image" | head -1)
          if [ -f "$IMG_PATH" ]; then
            cp "$IMG_PATH" /tmp/AK3/Image
            cp anykernel/anykernel.sh /tmp/AK3/
            cd /tmp/AK3 && zip -r9 $GITHUB_WORKSPACE/StealthStation-v2.8.zip .
          else
            echo "ERROR: Kernel Image not found!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealthStation-Final
          path: StealthStation-v2.8.zip
