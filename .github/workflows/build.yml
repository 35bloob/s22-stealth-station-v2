name: S22 Snapdragon Stealth v2.0
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc flex bison libssl-dev libelf-dev git curl wget zip unzip python3 device-tree-compiler jq rsync llvm lld clang

      - name: Download Snapdragon Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          # Using a stable prebuilt Clang 17 for Snapdragon
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xJf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz -C $GITHUB_WORKSPACE/clang --strip-components=1
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Clone S22 Snapdragon Source
        run: |
          git clone --depth 1 https://github.com/afaneh92/android_kernel_samsung_sm8450.git src
          echo "KERNEL_DIR=$PWD/src" >> $GITHUB_ENV

      - name: Patch & Build
        run: |
          cd ${{ env.KERNEL_DIR }}
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Integrate KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # Inject RTL8188FU
          git clone --depth=1 https://github.com/kelebek333/rtl8188fu drivers/net/wireless/rtl8188fu
          echo "obj-y += rtl8188fu/" >> drivers/net/wireless/Makefile
          
          # Configure for Snapdragon (taro)
          make O=out ARCH=arm64 LLVM=1 taro_defconfig
          
          # Merge Stealth Fragments
          cat $GITHUB_WORKSPACE/configs/nethunter.config >> out/.config
          cat $GITHUB_WORKSPACE/configs/stealth.config >> out/.config
          
          # Final Compilation
          make O=out -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 Image

      - name: Create ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 /tmp/AK3
          cp ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image /tmp/AK3/
          cp $GITHUB_WORKSPACE/anykernel/anykernel.sh /tmp/AK3/
          cd /tmp/AK3 && zip -r9 $GITHUB_WORKSPACE/StealthStation-v2.0.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealthStation-Final
          path: StealthStation-v2.0.zip
