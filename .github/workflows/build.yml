name: S22 Stealth v3.12
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc flex bison libssl-dev libelf-dev git curl wget zip unzip python3 device-tree-compiler jq rsync llvm lld clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          mkdir -p $GITHUB_WORKSPACE/clang
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.0/clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          tar -xJf clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz -C $GITHUB_WORKSPACE/clang --strip-components=1
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
      - name: Build
        run: |
          git clone --depth 1 https://github.com/Vikinsson207/android_kernel_samsung_sm8450.git src
          REAL_ROOT=$(find src -name "Makefile" | xargs grep -l "VERSION =" | head -1 | xargs dirname)
          cd "$REAL_ROOT"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          sed -i 's/in_group_p(F2FS_OPTION(sbi).flush_group)/1/g' fs/f2fs/data.c || true
          find . -name "Makefile" -exec sed -i 's/-Werror//g' {} + || true
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          mkdir -p drivers/net/wireless/rtl8188fu
          git clone --depth=1 https://github.com/kelebek333/rtl8188fu /tmp/rtl8188fu
          cp -r /tmp/rtl8188fu/* drivers/net/wireless/rtl8188fu/
          echo "obj-y += rtl8188fu/" >> drivers/net/wireless/Makefile
          make gki_defconfig
          CONF=$(find arch/arm64/configs -name "*waipio*" -o -name "*taro*" | head -1)
          if [ -n "$CONF" ]; then cat "$CONF" >> .config; fi
          cat $GITHUB_WORKSPACE/configs/nethunter.config >> .config
          cat $GITHUB_WORKSPACE/configs/stealth.config >> .config
          sed -i 's/CONFIG_WERROR=y/CONFIG_WERROR=n/g' .config
          echo "CONFIG_LTO_NONE=y" >> .config
          echo "CONFIG_HEADERS_INSTALL=n" >> .config
          make olddefconfig
          make -j$(nproc) LLVM=1 KCFLAGS="-w" vmlinux
          llvm-objcopy -O binary vmlinux arch/arm64/boot/Image
      - name: ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 /tmp/AK3
          IMG=$(find src -name "Image" -type f | head -1)
          cp "$IMG" /tmp/AK3/Image
          cp anykernel/anykernel.sh /tmp/AK3/
          cd /tmp/AK3 && zip -r9 $GITHUB_WORKSPACE/StealthStation-v3.12.zip .
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: StealthStation-Final
          path: StealthStation-v3.12.zip
