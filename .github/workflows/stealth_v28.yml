name: Autonomous S22 Solver V28
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  agent_build:
    runs-on: ubuntu-latest
    steps:
      - name: Phase 0 Setup
        run: sudo apt-get update && sudo apt-get install -y bc flex bison libssl-dev libelf-dev git curl wget zip unzip python3 device-tree-compiler jq rsync llvm lld clang gcc-aarch64-linux-gnu
      - name: Phase 1 Fetch
        run: git clone --depth 1 https://github.com/yoroi88/android_kernel_samsung_sm8550.git src && cd src && curl -L -sS "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
      - name: Phase 3 Config
        run: cd src && export ARCH=arm64 && export SUBARCH=arm64 && make O=out ARCH=arm64 gki_defconfig
      - name: Phase 5 Compile
        run: cd src && export ARCH=arm64 && export SUBARCH=arm64 && export PATH=/usr/bin:$PATH && make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- Image.gz
      - name: Phase 6 Package
        run: cp src/out/arch/arm64/boot/Image.gz anykernel/ && cd anykernel && zip -r9 "../StealthStation-V25-S22.zip" *
      - name: Phase 7 Upload
        uses: actions/upload-artifact@v4
        with:
          name: StealthStation-V25-S22
          path: StealthStation-V25-S22.zip
