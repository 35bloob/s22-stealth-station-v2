name: StealthStation V26 Power
on:
  workflow_dispatch:
jobs:
  agent_build:
    runs-on: ubuntu-latest
    steps:
      - name: Phase 0 - Setup Env
        run: |
          sudo apt-get update
          sudo apt-get install -y bc flex bison libssl-dev libelf-dev git curl wget zip unzip python3 \
          device-tree-compiler jq rsync llvm lld clang gcc-aarch64-linux-gnu

      - name: Phase 1 & 2 - Fetch & Inject Drivers
        run: |
          # 1. Clone kernel tree
          git clone --depth 1 https://github.com/yoro1836/zero_kernel.git src
          
          # 2. Clone drivers to a STAGING area (fixes Git 128)
          mkdir -p staging
          git clone --depth 1 https://github.com/kimocoder/rtl8188fu.git staging/rtl8188fu
          git clone --depth 1 https://github.com/aircrack-ng/rtl8812au.git staging/rtl8812au
          git clone --depth 1 https://github.com/morrownr/8814au.git staging/8814au
          git clone --depth 1 https://github.com/cilynx/rtl88x2bu.git staging/rtl88x2bu
          
          # 3. Move them into the kernel tree
          mkdir -p src/drivers/net/wireless/realtek
          mv staging/* src/drivers/net/wireless/realtek/
          
          # 4. Rooting
          cd src && curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Phase 3 & 4 - Power Configuration
        run: |
          cd src
          find . -type f -name "*defconfig" -exec sed -i 's/CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_NONE=y/g' {} +
          find . -type f -name "*defconfig" -exec sed -i 's/CONFIG_LTO_CLANG_THIN=y/CONFIG_LTO_CLANG_NONE=y/g' {} +
          
          export ARCH=arm64
          make gki_defconfig
          chmod +x scripts/config

          # WIRELESS AUDITING POWER
          ./scripts/config --enable CONFIG_QCACLD_WLAN_MONITOR
          ./scripts/config --enable CONFIG_NET_CLS_BPF --enable CONFIG_BPF_SYSCALL
          
          # USB GADGET & BT POWER
          ./scripts/config --enable CONFIG_USB_F_HID --enable CONFIG_USB_CONFIGFS_F_HID
          ./scripts/config --enable CONFIG_USB_F_MASS_STORAGE
          ./scripts/config --enable CONFIG_BT_HCIVHCI --enable CONFIG_BT_HCIUART_H4
          
          # NETWORKING SPEED (BBR)
          ./scripts/config --enable CONFIG_TCP_CONG_BBR --set-str CONFIG_DEFAULT_TCP_CONG "bbr"
          
          make olddefconfig

      - name: Phase 5 - Build Kernel
        run: |
          cd src
          export ARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) LLVM=1 KCFLAGS="-w" Image
          cp arch/arm64/boot/Image $GITHUB_WORKSPACE/Image

      - name: Phase 6 - Package & Upload
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          cp Image AK3/Image
          cd AK3 && zip -r9 ../StealthStation-V26-Power.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealthStation-V26-Final
          path: StealthStation-V26-Power.zip
